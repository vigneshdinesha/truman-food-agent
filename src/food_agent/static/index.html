<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{AGENT_NAME}} — {{AGENT_TAGLINE}}</title>
<style>
  :root{
    --green:#137a3f; --green-deep:#0e5c2f; --green-soft:#eaf5ee;
    --ink:#16241c; --muted:#5b6b62; --line:#e2ece6; --bg:#f4f8f5; --card:#ffffff;
    --clean:#16a34a; --caution:#ca8a04; --concern:#dc2626;
    --shadow:0 10px 30px rgba(19,122,63,.10), 0 2px 8px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
    color:var(--ink); background:
      radial-gradient(1100px 500px at 50% -200px, #e6f4ec 0%, rgba(230,244,236,0) 70%),
      var(--bg);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px; margin:0 auto; padding:48px 20px 80px}

  /* ── Header ───────────────────────────────────────────── */
  header{text-align:center; margin-bottom:26px}
  .logo{display:inline-flex; align-items:center; gap:10px; font-weight:800; font-size:34px; letter-spacing:-.02em}
  .leaf{
    width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,var(--green),var(--green-deep));
    display:grid;place-items:center;box-shadow:0 6px 16px rgba(19,122,63,.35);
    animation:pop .6s cubic-bezier(.2,1.2,.3,1) both;
  }
  .leaf svg{width:20px;height:20px}
  h1{margin:0} /* logo replaces */
  .tagline{margin:8px 0 0; color:var(--muted); font-size:15.5px}

  /* ── Search card ──────────────────────────────────────── */
  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:18px; box-shadow:var(--shadow); animation:rise .5s ease both;
  }
  .searchrow{display:flex; gap:10px}
  .field{
    flex:1; display:flex; align-items:center; gap:8px; background:#fff;
    border:1.5px solid var(--line); border-radius:12px; padding:0 12px;
    transition:border-color .18s, box-shadow .18s;
  }
  .field:focus-within{border-color:var(--green); box-shadow:0 0 0 4px var(--green-soft)}
  .field svg{width:18px;height:18px;color:var(--muted);flex:none}
  .field input{border:0;outline:0;font-size:16px;padding:13px 0;width:100%;background:transparent;color:var(--ink)}
  button{
    font:inherit; font-weight:650; font-size:15px; cursor:pointer; border:0; border-radius:12px;
    background:linear-gradient(145deg,var(--green),var(--green-deep)); color:#fff; padding:0 20px;
    box-shadow:0 4px 12px rgba(19,122,63,.28); transition:transform .12s, box-shadow .18s, filter .18s;
  }
  button:hover{filter:brightness(1.05); box-shadow:0 6px 18px rgba(19,122,63,.36)}
  button:active{transform:translateY(1px)}
  button:disabled{filter:grayscale(.4) brightness(.9); cursor:default; box-shadow:none}
  .or{display:flex; align-items:center; gap:12px; margin:14px 2px 2px; color:var(--muted); font-size:13.5px}
  .or::before,.or::after{content:"";height:1px;background:var(--line);flex:1}
  .uprow{display:flex; align-items:center; gap:10px; margin-top:12px}
  .upload{
    display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:14.5px; color:var(--green-deep);
    font-weight:600; background:var(--green-soft); border:1px dashed #b7d8c4; border-radius:11px; padding:11px 14px;
    transition:background .18s, border-color .18s;
  }
  .upload:hover{background:#dff0e6; border-color:var(--green)}
  .upload svg{width:17px;height:17px}
  .upload input{display:none}
  .fname{font-size:13.5px;color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .examples{margin:16px 2px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .examples span{font-size:13px;color:var(--muted)}
  .chip-ex{
    font-size:13px; background:#fff; border:1px solid var(--line); color:var(--ink);
    border-radius:999px; padding:6px 12px; cursor:pointer; transition:all .15s;
  }
  .chip-ex:hover{border-color:var(--green); color:var(--green-deep); background:var(--green-soft)}

  /* ── Loading ──────────────────────────────────────────── */
  #loading{display:none; margin-top:22px; text-align:center; animation:rise .35s ease both}
  .thinking{display:inline-flex; gap:6px; align-items:center; justify-content:center; margin-bottom:10px}
  .thinking i{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;animation:bounce 1s infinite ease-in-out}
  .thinking i:nth-child(2){animation-delay:.15s}
  .thinking i:nth-child(3){animation-delay:.3s}
  #loadmsg{color:var(--muted); font-size:14.5px; transition:opacity .3s}

  /* ── Result ───────────────────────────────────────────── */
  #result{margin-top:22px; display:none}
  #result.show{display:block}
  .verdict{
    background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden;
    box-shadow:var(--shadow); animation:rise .5s cubic-bezier(.2,.8,.3,1) both;
  }
  .vhead{padding:20px 22px 6px}
  .foodname{font-size:21px; font-weight:750; letter-spacing:-.01em; margin:0}
  .badge{
    display:inline-flex; align-items:center; gap:7px; margin-top:10px; font-weight:700; font-size:14px;
    color:#fff; padding:6px 13px; border-radius:999px; animation:pop .5s .1s cubic-bezier(.2,1.2,.3,1) both;
  }
  .badge .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.9)}
  .summary{margin:14px 0 4px; font-size:16px; line-height:1.55; color:var(--ink)}

  /* Scale bar */
  .scale{padding:6px 22px 20px}
  .bar-track{
    position:relative; height:14px; border-radius:999px; margin:30px 0 8px;
    background:linear-gradient(90deg,#16a34a 0%, #65a30d 26%, #ca8a04 52%, #ea580c 76%, #dc2626 100%);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.15);
  }
  .marker{
    position:absolute; top:50%; left:0; transform:translate(-50%,-50%) scale(0);
    width:26px;height:26px;border-radius:50%; background:#fff; border:4px solid var(--ink);
    box-shadow:0 3px 8px rgba(0,0,0,.28); transition:left 1.05s cubic-bezier(.34,1.3,.4,1);
    animation:markerin .4s .15s cubic-bezier(.2,1.3,.3,1) forwards;
  }
  .flag{
    position:absolute; top:-34px; transform:translateX(-50%);
    background:var(--ink); color:#fff; font-size:12.5px; font-weight:700; white-space:nowrap;
    padding:4px 9px; border-radius:7px; opacity:0; transition:opacity .3s .6s, left 1.05s cubic-bezier(.34,1.3,.4,1);
  }
  .flag::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
  .flag.on{opacity:1}
  .ends{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-weight:600}
  .ends .r{color:#c0392b}
  .ends .l{color:var(--clean)}

  /* Ingredients */
  .sect{border-top:1px solid var(--line); padding:18px 22px}
  .sect h3{margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
  .ings{display:flex; flex-wrap:wrap; gap:9px}
  .ing{
    display:inline-flex; flex-direction:column; gap:2px; padding:8px 13px; border-radius:12px;
    border:1px solid var(--line); background:#fff; opacity:0; transform:translateY(8px);
    animation:rise .4s ease forwards;
  }
  .ing .n{font-weight:650; font-size:14px; display:flex; align-items:center; gap:7px}
  .ing .nn{font-size:12.5px; color:var(--muted)}
  .lv{width:8px;height:8px;border-radius:50%; flex:none}
  .lv.clean{background:var(--clean)} .lv.caution{background:var(--caution)} .lv.concern{background:var(--concern)}
  .ing.clean{background:#f0faf3;border-color:#cdebd7}
  .ing.caution{background:#fdf7e8;border-color:#f0e2b8}
  .ing.concern{background:#fdeeee;border-color:#f4cccc}

  /* Full breakdown */
  details.full{border-top:1px solid var(--line)}
  details.full summary{
    list-style:none; cursor:pointer; padding:15px 22px; font-weight:650; font-size:14.5px; color:var(--green-deep);
    display:flex; align-items:center; gap:8px; user-select:none;
  }
  details.full summary::-webkit-details-marker{display:none}
  details.full summary .caret{transition:transform .2s} details.full[open] summary .caret{transform:rotate(90deg)}
  .md{padding:0 22px 20px; font-size:14.5px; line-height:1.6; color:#2b3a31}
  .md h4{margin:16px 0 6px; font-size:14px; color:var(--green-deep)}
  .md strong{color:var(--ink)}
  .md ul{margin:6px 0; padding-left:20px} .md li{margin:3px 0}
  .meta{padding:11px 22px; background:var(--green-soft); color:var(--muted); font-size:12.5px;
    display:flex; gap:14px; align-items:center; border-top:1px solid var(--line)}
  .meta b{color:var(--green-deep); font-weight:700}

  .notice{
    background:#fff; border:1px solid var(--line); border-left:3px solid var(--caution); border-radius:12px;
    padding:16px 18px; font-size:15px; line-height:1.55; box-shadow:var(--shadow); animation:rise .4s ease both;
  }
  footer{text-align:center; margin-top:34px; color:var(--muted); font-size:12.5px}
  footer a{color:var(--green-deep); text-decoration:none; font-weight:600}
  footer a:hover{text-decoration:underline}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
  @keyframes markerin{to{transform:translate(-50%,-50%) scale(1)}}
  @keyframes bounce{0%,80%,100%{transform:scale(.5);opacity:.5}40%{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <span class="leaf" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M20 4C11 4 5 8 5 15c0 2 .6 3.5 1.6 4.6C8 15 11 12 16 10c-4 3-6.5 6-7.7 10.4C15 21 20 15 20 4Z" fill="#fff"/></svg>
      </span>
      {{AGENT_NAME}}
    </div>
    <p class="tagline">{{AGENT_TAGLINE}}</p>
  </header>

  <div class="panel">
    <div class="searchrow">
      <label class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="food" placeholder="Name a food — “Hidden Valley Ranch”, “Oreo”…" autocomplete="off">
      </label>
      <button id="goName" onclick="byName()">Check it</button>
    </div>

    <div class="or">or scan a label</div>
    <div class="uprow">
      <label class="upload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Upload a label photo
        <input type="file" id="img" accept="image/*" onchange="onFile()">
      </label>
      <span class="fname" id="fname"></span>
      <button id="goLabel" onclick="byLabel()" style="display:none">Read label</button>
    </div>

    <div class="examples">
      <span>Try:</span>
      <button class="chip-ex" onclick="ex('Coca-Cola')">Coca-Cola</button>
      <button class="chip-ex" onclick="ex('Doritos')">Doritos</button>
      <button class="chip-ex" onclick="ex('Chobani plain yogurt')">Chobani yogurt</button>
    </div>
  </div>

  <div id="loading">
    <div class="thinking"><i></i><i></i><i></i></div>
    <div id="loadmsg">Truman is thinking…</div>
  </div>

  <div id="result"></div>

  <footer>
    Every verdict is grounded in sourced data — Truman abstains rather than guess.
    &nbsp;·&nbsp; <a href="https://github.com/vigneshdinesha/truman-food-agent" target="_blank" rel="noopener">source on GitHub</a>
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const loadMsgs = [
  "Pulling the real ingredient list…",
  "Checking each additive against sourced data…",
  "Cross-referencing FDA / EFSA notes…",
  "Forming an honest verdict…"
];
let msgTimer;

function setLoading(on, first){
  $("#loading").style.display = on ? "block" : "none";
  $("#goName").disabled = on; $("#goLabel").disabled = on;
  if(on){
    $("#result").className = "";
    let i = 0; $("#loadmsg").textContent = first || loadMsgs[0];
    clearInterval(msgTimer);
    msgTimer = setInterval(()=>{ i=(i+1)%loadMsgs.length;
      const m=$("#loadmsg"); m.style.opacity=0;
      setTimeout(()=>{ m.textContent=loadMsgs[i]; m.style.opacity=1; }, 250);
    }, 1600);
  } else clearInterval(msgTimer);
}

function ex(v){ $("#food").value = v; byName(); }
function onFile(){
  const f = $("#img").files[0];
  $("#fname").textContent = f ? f.name : "";
  $("#goLabel").style.display = f ? "inline-block" : "none";
}

async function byName(){
  const food = $("#food").value.trim(); if(!food) return;
  setLoading(true, "Looking up “"+food+"”…");
  try{
    const r = await fetch("/analyze", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({food})});
    render(await r.json());
  }catch(e){ notice("Something went wrong reaching Truman. Try again in a moment."); }
  setLoading(false);
}

async function byLabel(){
  const f = $("#img").files[0]; if(!f) return;
  setLoading(true, "Reading the label…");
  try{
    const fd = new FormData(); fd.append("file", f);
    const r = await fetch("/analyze-label", {method:"POST", body:fd});
    render(await r.json());
  }catch(e){ notice("Couldn't read that image. Try a clearer photo of the ingredients."); }
  setLoading(false);
}

// ── tier → color ──────────────────────────────────────────
const TIERS = [
  {min:85, label:"Fully Clean",        c:"#16a34a"},
  {min:65, label:"Mostly Clean",       c:"#65a30d"},
  {min:45, label:"Some Concerns",      c:"#ca8a04"},
  {min:25, label:"Questionable",       c:"#ea580c"},
  {min:0,  label:"Highly Questionable",c:"#dc2626"},
];
const tierFor = s => TIERS.find(t => s >= t.min);

function render(j){
  const v = j.verdict;
  if(!v){ notice(j.answer || j.error || "No verdict available."); return; }
  const t = tierFor(v.score);
  const pos = 100 - v.score;                 // left = clean, right = questionable
  const ings = (v.ingredients||[]).slice(0,8);

  const html = `
  <div class="verdict">
    <div class="vhead">
      <p class="foodname">${esc(v.food_name || "This food")}</p>
      <span class="badge" style="background:${t.c}"><span class="dot"></span>${esc(v.tier||t.label)} · ${v.score}/100</span>
      <p class="summary">${esc(v.summary||"")}</p>
    </div>
    <div class="scale">
      <div class="bar-track">
        <div class="flag" id="flag" style="left:${pos}%">${v.score}/100</div>
        <div class="marker" id="marker" style="left:${pos}%; border-color:${t.c}"></div>
      </div>
      <div class="ends"><span class="l">Fully clean</span><span class="r">Highly questionable</span></div>
    </div>
    ${ings.length ? `<div class="sect"><h3>What's inside</h3><div class="ings">${
      ings.map((g,i)=>`<span class="ing ${lvl(g.level)}" style="animation-delay:${.05*i+.2}s">
        <span class="n"><span class="lv ${lvl(g.level)}"></span>${esc(g.name||"")}</span>
        ${g.note?`<span class="nn">${esc(g.note)}</span>`:""}</span>`).join("")
    }</div></div>` : ""}
    <details class="full">
      <summary><span class="caret">▸</span> See Truman's full breakdown</summary>
      <div class="md">${mdToHtml(j.answer||"")}</div>
    </details>
    <div class="meta">🔎 <span>grounded in <b>${j.tool_calls||0}</b> sourced lookups</span>
      ${j.cost_usd!=null?`<span>· cost <b>$${j.cost_usd}</b></span>`:""}</div>
  </div>`;

  const box = $("#result"); box.innerHTML = html; box.className = "show";
  box.scrollIntoView({behavior:"smooth", block:"start"});
  // trigger marker slide + flag from the clean end
  const m = $("#marker"), fl = $("#flag");
  m.style.left = "0%"; fl.style.left = "0%";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    m.style.left = pos+"%"; fl.style.left = pos+"%"; fl.classList.add("on");
  }));
}

function notice(text){
  const box = $("#result");
  box.innerHTML = `<div class="notice">${esc(text)}</div>`;
  box.className = "show"; box.scrollIntoView({behavior:"smooth", block:"start"});
}

const lvl = l => (l==="concern"||l==="caution"||l==="clean") ? l : "caution";
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// tiny markdown → html for the full breakdown
function mdToHtml(md){
  const lines = String(md).split("\n"); let out=[], inList=false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  const closeList = ()=>{ if(inList){out.push("</ul>"); inList=false;} };
  for(let raw of lines){
    const l = raw.trimEnd();
    if(!l.trim()){ closeList(); continue; }
    let m;
    if(m = l.match(/^#{2,4}\s+(.*)/)){ closeList(); out.push("<h4>"+inline(m[1])+"</h4>"); }
    else if(m = l.match(/^\s*[-*]\s+(.*)/)){ if(!inList){out.push("<ul>");inList=true;} out.push("<li>"+inline(m[1])+"</li>"); }
    else if(m = l.match(/^\s*\d+\.\s+(.*)/)){ if(!inList){out.push("<ul>");inList=true;} out.push("<li>"+inline(m[1])+"</li>"); }
    else { closeList(); out.push("<p>"+inline(l)+"</p>"); }
  }
  closeList(); return out.join("");
}

$("#food").addEventListener("keydown", e => { if(e.key==="Enter") byName(); });
</script>
</body>
</html>
